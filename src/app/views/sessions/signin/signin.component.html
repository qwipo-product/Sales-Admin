<div class="page-wrap h-full slate">
  <div class="session-form-hold">
    <mat-progress-bar mode="determinate" class="session-progress"></mat-progress-bar>
    <mat-card class="!m-0" *ngIf="showSigninPage">
      <mat-card-content>
        <div class="flex flex-col items-center !py-4">
          <img width="60px" src="assets/images/egret.png" alt="" />
          <p class="text-muted m-0">Sign in to your account</p>
        </div>
        <p class="text-center" *ngIf="errorMsg">
          <small class="text-red">{{ errorMsg }}</small>
        </p>
        <form [formGroup]="signinForm" (ngSubmit)="submit()">
          <div class="">
            <mat-form-field class="full-width">
              <input
                matInput
                name="username"
                placeholder="Username"
                value=""
                [formControl]="signinForm.controls['username']"
              />
            </mat-form-field>
            <small
              *ngIf="signinForm.controls['username'].hasError('required') && signinForm.controls['username'].touched"
              class="form-error-msg"
            >
              Username is required
            </small>
          </div>

          <div class="">
            <mat-form-field class="full-width">
              <input
                type="password"
                name="password"
                matInput
                placeholder="Password"
                value=""
                [formControl]="signinForm.controls['password']"
              />
            </mat-form-field>
            <small
              *ngIf="signinForm.controls['password'].hasError('required') && signinForm.controls['password'].touched"
              class="form-error-msg"
            >
              Password is required
            </small>
          </div>

          <div class="!pb-4">
            <mat-checkbox name="rememberMe" [formControl]="signinForm.controls['rememberMe']" class="!pb-4"
              >Remember this computer</mat-checkbox
            >
          </div>

          <button mat-raised-button class="mat-primary full-width mb-4" [disabled]="signinForm.invalid">
            Sign in
          </button>
          <div class="text-center flex">
            <a [routerLink]="'/sessions/forgot-password'" class="mat-primary text-center full-width">Forgot password</a>
            <span class="flex-grow"></span>
            <a [routerLink]="'/sessions/signup'" class="mat-primary text-center full-width">Create a new account</a>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
