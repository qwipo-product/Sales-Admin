<ng-container>
  <div class="heading-block">
    <div class="row">
      <div class="col-md-6">
        <mat-icon class="backicon" [routerLink]="['/salesperson-list']">arrow_back</mat-icon>
        <span class="header">
          <h2 class="card-title m-3">Edit Salesperson</h2>
        </span>
      </div>
      <div class="col-md-6 text-right"></div>
    </div>
  </div>

  <div class="table-block">
    <form [formGroup]="dataSource">
      <section id="content">
        <div class="card">
          <div class="card-body card-padding">
            <div class="row">
              <div class="col-md-6">
                <mat-form-field class="full-width">
                  <mat-label>Name</mat-label>
                  <input matInput type="string" formControlName="name" name="name" placeholder="Name" />
                </mat-form-field>
              </div>
              <div class="col-md-6">
                <mat-form-field class="full-width">
                  <mat-label>Business Name</mat-label>
                  <input
                    matInput
                    type="string"
                    formControlName="businessName"
                    name="businessName"
                    placeholder="Business Name"
                  />
                </mat-form-field>
              </div>
              <div class="row">
                <div class="buttonSection">
                  <button mat-raised-button color="primary" class="text-center ml" (click)="updateCustomer()">
                    Update
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </form>
  </div>
</ng-container>
