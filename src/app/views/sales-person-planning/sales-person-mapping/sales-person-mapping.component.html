<ng-container *ngIf="permissionObj?.view">
  <div class="row">
    <div class="col-md-6"></div>
    <div class="col-md-6 float-right">
      <mat-card class="w-40 float-right">
        <mat-card-content>
          <mat-select [(ngModel)]="selectedOption" (ngModelChange)="onSelectionChange($event)">
            <mat-option value="true"> Active </mat-option>
            <mat-option value="false"> In-Active </mat-option>
          </mat-select>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
  <div
    class="m-3 flex-col md:flex-row justify-between"
    style="clear: both"
    [@animate]="{ value: '*', params: { y: '50px', delay: '300ms' } }"
  >
    <mat-card class="p-0">
      <mat-card-content class="p-0">
        <mat-sidenav-container fxFlex="0 1 auto">
          <mat-sidenav-content>
            <div class="table-container">
              <mat-table matSort [dataSource]="dataSource">
                <ng-container matColumnDef="Name">
                  <mat-header-cell *matHeaderCellDef> Name </mat-header-cell>
                  <mat-cell *matCellDef="let element" data-label="name"> {{ element.name }} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="Mobile Number">
                  <mat-header-cell *matHeaderCellDef> Mobile Number </mat-header-cell>
                  <mat-cell *matCellDef="let element" data-label="mobileNumber"> {{ element.mobileNumber }} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="Area Name">
                  <mat-header-cell *matHeaderCellDef style="text-align: center">Area Name </mat-header-cell>
                  <mat-cell *matCellDef="let element" data-label="name"> {{ element.areaName }} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="Customer Count">
                  <mat-header-cell *matHeaderCellDef>Customer Count</mat-header-cell>
                  <mat-cell *matCellDef="let element" data-label="areaCode" class="text-center"> {{ element.customerCount }} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="Is Active">
                  <mat-header-cell *matHeaderCellDef class="" style="justify-content: center"> Status </mat-header-cell>
                  <mat-cell *matCellDef="let element" style="justify-content: center" data-label="isActive">
                    <button
                      mat-raised-button
                      class="mr-8"
                      color="white"
                      (click)="changeSalesPersonStatus(element.id, true)"
                      *ngIf="!element.isActive && permissionObj?.edit"
                    >
                      Activate
                    </button>
                    <button
                      mat-raised-button
                      class="mr-8"
                      color="red"
                      (click)="changeSalesPersonStatus(element.id, false)"
                      *ngIf="element.isActive && permissionObj?.edit"
                    >
                      Deactivate
                    </button>
                  </mat-cell>
                </ng-container>

                <ng-container matColumnDef="Action">
                  <mat-header-cell *matHeaderCellDef class="" style="justify-content: center"> Action </mat-header-cell>
                  <mat-cell *matCellDef="let element" style="justify-content: center">
                    <button
                      mat-raised-button
                      class="m-2"
                      color="primary"
                      [disabled]="!element.isActive"
                      (click)="selectAreaPopUp(element)"
                      *ngIf="permissionObj?.edit"
                    >
                      {{ element.areaName ? 'EDIT' : 'ADD' }}
                    </button>
                  </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="salesPersonColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: salesPersonColumns"></mat-row>
              </mat-table>
            </div>
          </mat-sidenav-content>
        </mat-sidenav-container>
      </mat-card-content>
    </mat-card>
  </div>
</ng-container>
<ng-container *ngIf="!permissionObj?.view">
  <p class="text-center">You dont have permission , Please contact administrator</p>
</ng-container>
