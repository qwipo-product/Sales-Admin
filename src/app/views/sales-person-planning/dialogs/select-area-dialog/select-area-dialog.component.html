<ng-container>
  <div class="row">
    <div class="col-md-6">
      <h2 class="card-title m-3 text-violet">Select Area</h2>
    </div>
    <div class="col-md-6">
      <mat-icon class="float-right m-3 closeicon" (click)="dialogRef.close()"> close </mat-icon>
    </div>
  </div>
  <form class="m-3" [formGroup]="dataSource">
    <section id="content">
      <mat-card>
        <mat-card-content>
          <mat-form-field style="width: 60%">
            <mat-label>Select Clustered Area</mat-label>
            <mat-select formControlName="clusteredArea" (selectionChange)="onClusteredAreaChange()">
              <mat-option *ngFor="let cluster of clusters" [value]="cluster"> {{ cluster.name }} </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="text-center">
            <button mat-raised-button color="primary" class="mt-3" (click)="submit()">Submit</button>
          </div>
        </mat-card-content>
      </mat-card>
    </section>
  </form>
</ng-container>
