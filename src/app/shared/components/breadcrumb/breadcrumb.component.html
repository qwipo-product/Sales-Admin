<div class="container-dynamic">
  <!-- Simple breadcrumb (shipped config) – NB the "/" prefix inside each link is an app change vs Egret -->
  <div class="breadcrumb-bar" *ngIf="layout.layoutConf.useBreadcrumb && layout.layoutConf.breadcrumb === 'simple'">
    <ul class="breadcrumb">
      <li *ngFor="let part of routeParts">
        <a routerLink="/{{ part.url }}">/{{ part.breadcrumb | translate }}</a>
      </li>
    </ul>
  </div>

  <!-- Breadcrumb with title -->
  <div class="breadcrumb-title" *ngIf="layout.layoutConf.useBreadcrumb && layout.layoutConf.breadcrumb === 'title'">
    <h1 class="bc-title">
      {{ routeParts[routeParts.length - 1]?.breadcrumb | translate }}
    </h1>
    <ul class="breadcrumb" *ngIf="routeParts.length > 1">
      <li *ngFor="let part of routeParts">
        <a routerLink="/{{ part.url }}" class="text-muted">{{ part.breadcrumb | translate }}</a>
      </li>
    </ul>
  </div>
</div>
