<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<!-- <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet" /> -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Public+Sans&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
			crossorigin="anonymous"
		/>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
			crossorigin="anonymous"
		></script>
		<style>
			.app-loader {
				height: 100vh !important;
				width: 100%;
				position: absolute;
				top: 0;
				left: 0;
				display: flex;
				align-items: center;
			}

			.spinner {
				width: 40px;
				height: 40px;
				position: relative;
				margin: auto;
			}

			.double-bounce1,
			.double-bounce2 {
				width: 100%;
				height: 100%;
				border-radius: 50%;
				opacity: 0.6;
				position: absolute;
				top: 0;
				left: 0;
				-webkit-animation: sk-bounce 2s infinite ease-in-out;
				animation: sk-bounce 2s infinite ease-in-out;
			}

			.double-bounce2 {
				-webkit-animation-delay: -1s;
				animation-delay: -1s;
			}

			@-webkit-keyframes sk-bounce {
				0%,
				100% {
					-webkit-transform: scale(0);
				}

				50% {
					-webkit-transform: scale(1);
				}
			}

			@keyframes sk-bounce {
				0%,
				100% {
					transform: scale(0);
					-webkit-transform: scale(0);
				}

				50% {
					transform: scale(1);
					-webkit-transform: scale(1);
				}
			}
		</style>
	</head>

	<body class="">
		<app-root>
			<div class="app-loader">
				<div class="spinner">
					<div class="double-bounce1 mat-bg-primary" style="background: #fcc02e"></div>
					<div class="double-bounce2 mat-bg-accent" style="background: #03a9f4"></div>
				</div>
			</div>
		</app-root>

		<!-- <script>

	</body>
</html>
